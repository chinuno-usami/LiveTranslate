name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: windows-x86_64
            os: windows-latest
          - name: macos
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup2.4-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            build-essential

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt (check)
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo check
        run: cargo check --locked --all-targets

      - name: cargo test
        run: cargo test --locked --all-targets

      # ---- 构建风味校验 ----

      - name: cargo check + clippy + test (osc)
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --all-targets --features osc
          cargo clippy --locked --all-targets --features osc -- -D warnings
          cargo test --locked --all-targets --features osc

      # 非 Windows 上 steamvr 走 stub.rs，且 render.rs 单测在 Linux/macOS 同样应运行
      - name: cargo check + clippy + test (steamvr stub + render, 非 Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --all-targets --features steamvr
          cargo clippy --locked --all-targets --features steamvr -- -D warnings
          cargo test --locked --all-targets --features steamvr

      - name: cargo check + clippy + test (extras / Full)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --all-targets --features extras
          cargo clippy --locked --all-targets --features extras -- -D warnings
          cargo test --locked --all-targets --features extras

      # 关闭 silero-vad（无 ort/libloading）的降级路径
      - name: cargo check + test (no default features)
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --all-targets --no-default-features --features custom-protocol
          cargo test --locked --all-targets --no-default-features --features custom-protocol

      # 标准包不能链接可选依赖（rosc / openvr / cosmic-text）
      - name: standard build excludes optional deps
        shell: bash
        run: |
          set -euo pipefail
          # 先独立落盘：cargo tree 失败时 set -e 直接终止，避免 grep 拿到空输入误判通过
          cargo tree --locked --prefix none --features custom-protocol > /tmp/standard-tree.txt
          if grep -E '^(rosc|openvr|cosmic-text)( |$)' /tmp/standard-tree.txt; then
            echo "::error::standard build must not link optional output dependencies"
            exit 1
          fi
          echo "ok: standard dependency tree is clean"

      # 锁文件不得在 CI 中被隐式改写
      - name: Cargo.lock is unchanged
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- Cargo.lock; then
            echo "::error::Cargo.lock changed during the build; commit the resolved lock file"
            exit 1
          fi
