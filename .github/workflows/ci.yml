name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: windows-x86_64
            os: windows-latest
          - name: macos
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup2.4-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            build-essential

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt (check)
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo test
        run: cargo test --all-targets

      # ---- v0.2 双构建风味校验 ----

      - name: cargo check (osc, Linux/macOS)
        if: runner.os != 'Windows'
        run: cargo check --all-targets --features osc

      - name: cargo check (extras / Full)
        if: runner.os == 'Windows'
        run: cargo check --all-targets --features extras

      - name: cargo clippy (extras / Full)
        if: runner.os == 'Windows'
        run: cargo clippy --all-targets --features extras -- -D warnings

      - name: cargo test (extras / Full)
        if: runner.os == 'Windows'
        run: cargo test --all-targets --features extras

      # 标准包不能链接可选依赖（rosc / openvr / cosmic-text）
      - name: standard build excludes optional deps
        shell: bash
        run: |
          set -euo pipefail
          if cargo tree --features custom-protocol | grep -E 'rosc|openvr|cosmic-text'; then
            echo "::error::standard build must not link optional output dependencies"
            exit 1
          fi
          echo "ok: standard dependency tree is clean"
