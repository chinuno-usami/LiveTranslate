name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (例如 v0.1.0)，必填'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: livetranslate
  # ONNX Runtime 版本单一来源：shell 脚本与 Windows 步骤都读取该值
  ORT_VERSION: "1.30.0"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: custom-protocol
            suffix: ""
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: custom-protocol
            suffix: ""
          # Full 版：SteamVR + OSC（仅 Windows）
          - name: windows-x86_64-full
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: custom-protocol,extras
            suffix: "-full"
          - name: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            features: custom-protocol
            suffix: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup2.4-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            file

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add single Rust target
        if: matrix.target != 'universal-apple-darwin'
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.name }}

      - name: Build (single target)
        if: matrix.target != 'universal-apple-darwin'
        run: cargo build --locked --release --features ${{ matrix.features }} --target ${{ matrix.target }}

      - name: Build (macOS universal)
        if: matrix.target == 'universal-apple-darwin'
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --locked --release --features "${FEATURES}" --target aarch64-apple-darwin
          cargo build --locked --release --features "${FEATURES}" --target x86_64-apple-darwin
          mkdir -p target/universal/release
          lipo -create \
            target/aarch64-apple-darwin/release/${BIN_NAME} \
            target/x86_64-apple-darwin/release/${BIN_NAME} \
            -output target/universal/release/${BIN_NAME}
          file target/universal/release/${BIN_NAME}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          NAME="${BIN_NAME}-${TARGET}"
          STAGE="dist/${NAME}"
          mkdir -p "$STAGE"

          cp "target/${TARGET}/release/${BIN_NAME}" "$STAGE/"
          chmod +x "$STAGE/${BIN_NAME}"
          # 附带 config.example.toml 而非 default.toml：避免默认落入便携模式导致多配置档不可用
          if [ -f config/default.toml ]; then
            mkdir -p "$STAGE/config"
            cp config/default.toml "$STAGE/config/config.example.toml"
          fi
          for f in README.md QUICKSTART.md; do
            [ -f "$f" ] && cp "$f" "$STAGE/"
          done
          [ -f docs/BUILD_FLAVORS.md ] && cp docs/BUILD_FLAVORS.md "$STAGE/"

          # 随包附带 ONNX Runtime（silero VAD 用），程序启动时自动发现
          bash scripts/fetch-onnxruntime.sh linux-x64 "$STAGE"

          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          ls -lh dist

      - name: Package (macOS .app)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # 官方只为 Apple Silicon 提供 macOS 预编译库；
          # Intel Mac 上会自动回退到能量 VAD
          bash scripts/fetch-onnxruntime.sh macos-arm64 dist/onnxruntime
          bash scripts/make-macos-app.sh \
            "target/universal/release/${BIN_NAME}" \
            dist \
            "${{ matrix.target }}" \
            dist/onnxruntime
          # BUILD_FLAVORS.md 已由 make-macos-app.sh 放进 Contents/Resources
          ls -lh dist

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          $suffix = "${{ matrix.suffix }}"
          $name = "$env:BIN_NAME-$target$suffix"
          $stage = "dist/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/$target/release/$env:BIN_NAME.exe" $stage
          # 附带 config.example.toml 而非 default.toml：默认走用户配置目录，保证标准版/Full 版配置互通与多配置档可用
          if (Test-Path config/default.toml) {
            New-Item -ItemType Directory -Force -Path "$stage/config" | Out-Null
            Copy-Item config/default.toml "$stage/config/config.example.toml"
          }
          foreach ($f in @('README.md','QUICKSTART.md','docs/BUILD_FLAVORS.md')) {
            if (Test-Path $f) { Copy-Item $f $stage }
          }

          # 随包附带 ONNX Runtime（silero VAD 用）
          $ortVersion = "$env:ORT_VERSION"
          $ortUrl = "https://github.com/microsoft/onnxruntime/releases/download/v$ortVersion/onnxruntime-win-x64-$ortVersion.zip"
          $ortZip = Join-Path $env:RUNNER_TEMP "ort.zip"
          $ortDir = Join-Path $env:RUNNER_TEMP "ort"
          Write-Host "downloading $ortUrl"
          Invoke-WebRequest -Uri $ortUrl -OutFile $ortZip

          # 完整性校验：校验和表与 scripts/fetch-onnxruntime.sh 共用 scripts/ort-checksums.txt，
          # 升级 ORT_VERSION 时只补一处；缺校验和直接失败，不再 warning 放行。
          $ortSha = $env:ORT_SHA256
          if (-not $ortSha) {
            $checksFile = 'scripts/ort-checksums.txt'
            if (Test-Path $checksFile) {
              foreach ($line in Get-Content $checksFile) {
                $trimmed = $line.Trim()
                if (-not $trimmed -or $trimmed.StartsWith('#')) { continue }
                $parts = $trimmed -split '\s+'
                if ($parts.Length -ge 2 -and $parts[0] -eq "win-x64/$ortVersion") {
                  $ortSha = $parts[1]
                  break
                }
              }
            }
          }
          if (-not $ortSha) {
            throw "没有 onnxruntime $ortVersion 的内置校验和；请在 scripts/ort-checksums.txt 补齐 SHA-256"
          }
          $actual = (Get-FileHash -Algorithm SHA256 -Path $ortZip).Hash.ToLower()
          if ($actual -ne $ortSha.ToLower()) {
            throw "onnxruntime $ortVersion SHA-256 mismatch`n  expected: $ortSha`n  actual:   $actual"
          }
          Write-Host "checksum ok"

          Expand-Archive -Path $ortZip -DestinationPath $ortDir -Force
          $dll = Get-ChildItem $ortDir -Recurse -Filter 'onnxruntime.dll' | Select-Object -First 1
          if (-not $dll) { throw 'onnxruntime.dll not found in archive' }
          Copy-Item $dll.FullName $stage
          Write-Host "bundled: $($dll.Name)"

          Compress-Archive -Path $stage -DestinationPath "dist/$name.zip" -Force
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # git-cliff 需要完整历史与全部 tag 才能确定版本区间
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -lhR dist

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches crate version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          ui_version=$(python3 -c "import json;print(json.load(open('tauri.conf.json'))['package']['version'])")
          if [ "${ui_version}" != "${version}" ]; then
            echo "::error::tauri.conf.json version ${ui_version} does not match Cargo.toml ${version}"
            exit 1
          fi
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::tag ${TAG} does not match Cargo.toml version v${version}"
            exit 1
          fi

      - name: Resolve changelog range
        id: cliff_args
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # tag 已指向当前提交（推送 tag 触发）时取该 tag 的区间；
          # 手动触发且 tag 尚未创建时，把未发布的提交归到该 tag 下
          if [ "$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}" || true)" = "$(git rev-parse HEAD)" ]; then
            echo "args=--current --strip header" >> "$GITHUB_OUTPUT"
          else
            echo "args=--unreleased --tag ${TAG} --strip header" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: ${{ steps.cliff_args.outputs.args }}
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Compose release body (flavors + changelog)
        env:
          CHANGELOG_PATH: ${{ steps.cliff.outputs.changelog }}
        run: |
          set -euo pipefail
          {
            if [ -f docs/BUILD_FLAVORS.md ]; then
              cat docs/BUILD_FLAVORS.md
            else
              echo '(构建风味说明 docs/BUILD_FLAVORS.md 缺失)'
            fi
            echo
            echo '---'
            echo
            cat "${CHANGELOG_PATH}"
          } > RELEASE_BODY.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          # 手动触发时让 tag 指向实际构建的提交，而不是默认分支 HEAD
          target_commitish: ${{ github.sha }}
          name: LiveTranslate ${{ steps.tag.outputs.tag }}
          files: dist/*
          body_path: RELEASE_BODY.md
          draft: false
          fail_on_unmatched_files: true
