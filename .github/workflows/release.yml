name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (例如 v0.1.0)，必填'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: livetranslate
  # ONNX Runtime 版本单一来源：shell 脚本与 Windows 步骤都读取该值
  ORT_VERSION: "1.30.0"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-universal
            os: macos-latest
            target: universal-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup2.4-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            file

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add single Rust target
        if: matrix.target != 'universal-apple-darwin'
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (single target)
        if: matrix.target != 'universal-apple-darwin'
        run: cargo build --release --features custom-protocol --target ${{ matrix.target }}

      - name: Build (macOS universal)
        if: matrix.target == 'universal-apple-darwin'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --features custom-protocol --target aarch64-apple-darwin
          cargo build --release --features custom-protocol --target x86_64-apple-darwin
          mkdir -p target/universal/release
          lipo -create \
            target/aarch64-apple-darwin/release/${BIN_NAME} \
            target/x86_64-apple-darwin/release/${BIN_NAME} \
            -output target/universal/release/${BIN_NAME}
          file target/universal/release/${BIN_NAME}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          NAME="${BIN_NAME}-${TARGET}"
          STAGE="dist/${NAME}"
          mkdir -p "$STAGE"

          cp "target/${TARGET}/release/${BIN_NAME}" "$STAGE/"
          chmod +x "$STAGE/${BIN_NAME}"
          [ -d config ] && cp -r config "$STAGE/"
          for f in README.md QUICKSTART.md; do
            [ -f "$f" ] && cp "$f" "$STAGE/"
          done

          # 随包附带 ONNX Runtime（silero VAD 用），程序启动时自动发现
          bash scripts/fetch-onnxruntime.sh linux-x64 "$STAGE"

          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          ls -lh dist

      - name: Package (macOS .app)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # 官方只为 Apple Silicon 提供 macOS 预编译库；
          # Intel Mac 上会自动回退到能量 VAD
          bash scripts/fetch-onnxruntime.sh macos-arm64 dist/onnxruntime
          bash scripts/make-macos-app.sh \
            "target/universal/release/${BIN_NAME}" \
            dist \
            "${{ matrix.target }}" \
            dist/onnxruntime
          ls -lh dist

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          $name = "$env:BIN_NAME-$target"
          $stage = "dist/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/$target/release/$env:BIN_NAME.exe" $stage
          if (Test-Path config) { Copy-Item -Recurse config $stage }
          foreach ($f in @('README.md','QUICKSTART.md')) {
            if (Test-Path $f) { Copy-Item $f $stage }
          }

          # 随包附带 ONNX Runtime（silero VAD 用）
          $ortVersion = "$env:ORT_VERSION"
          $ortUrl = "https://github.com/microsoft/onnxruntime/releases/download/v$ortVersion/onnxruntime-win-x64-$ortVersion.zip"
          $ortZip = Join-Path $env:RUNNER_TEMP "ort.zip"
          $ortDir = Join-Path $env:RUNNER_TEMP "ort"
          Write-Host "downloading $ortUrl"
          Invoke-WebRequest -Uri $ortUrl -OutFile $ortZip

          # 完整性校验：防止上游资产被替换 / 下载被篡改
          $ortSha = @{ '1.30.0' = 'c6ba983baf5681af108599675d2a89c2d145512d02de28aed0bff177cd0ba949' }[$ortVersion]
          if ($ortSha) {
            $actual = (Get-FileHash -Algorithm SHA256 -Path $ortZip).Hash.ToLower()
            if ($actual -ne $ortSha) {
              throw "onnxruntime $ortVersion SHA-256 mismatch`n  expected: $ortSha`n  actual:   $actual"
            }
            Write-Host "checksum ok"
          } else {
            Write-Warning "没有 onnxruntime $ortVersion 的内置校验和，跳过完整性校验"
          }

          Expand-Archive -Path $ortZip -DestinationPath $ortDir -Force
          $dll = Get-ChildItem $ortDir -Recurse -Filter 'onnxruntime.dll' | Select-Object -First 1
          if (-not $dll) { throw 'onnxruntime.dll not found in archive' }
          Copy-Item $dll.FullName $stage
          Write-Host "bundled: $($dll.Name)"

          Compress-Archive -Path $stage -DestinationPath "dist/$name.zip" -Force
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -lhR dist

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches crate version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::tag ${TAG} does not match Cargo.toml version v${version}"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          # 手动触发时让 tag 指向实际构建的提交，而不是默认分支 HEAD
          target_commitish: ${{ github.sha }}
          name: LiveTranslate ${{ steps.tag.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
