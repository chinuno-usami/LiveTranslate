[package]
name = "livetranslate"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"

[[bin]]
name = "livetranslate"
path = "src/main.rs"

[features]
# Tauri 生产构建必需的 feature：启用后资源会被嵌入二进制，
# 不再从 devPath 加载，同时关闭 dev 专用的 plist 生成逻辑。
# 本项目的 UI 是静态目录 (tauri-ui/)，不使用 tauri dev 服务器，
# 因此默认开启（否则交叉编译到 Windows 会因为 host 判定而失败）。
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Desktop overlay
tauri = { version = "1.6", features = ["api-all", "system-tray", "global-shortcut"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "stream", "multipart"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Audio
cpal = "0.18"
hound = "3.5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Config / CLI
directories = "5.0"
clap = { version = "4.4", features = ["derive"] }

# Windows-specific
[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_Media",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = { version = "1.5" }

[dev-dependencies]
# 用于校验 icons/icon.ico（Windows 构建时 Tauri 会解析该文件）
ico = "0.4"

[profile.release]
opt-level = 3
lto = true
