[package]
name = "livetranslate"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"

[[bin]]
name = "livetranslate"
path = "src/main.rs"

[features]
# Tauri 生产构建必需的 feature：启用后资源会被嵌入二进制，
# 不再从 devPath 加载，同时关闭 dev 专用的 plist 生成逻辑。
# 本项目的 UI 是静态目录 (tauri-ui/)，不使用 tauri dev 服务器，
# 因此默认开启（否则交叉编译到 Windows 会因为 host 判定而失败）。
default = ["custom-protocol", "silero-vad"]
custom-protocol = ["tauri/custom-protocol"]
# Silero VAD（需要 ONNX Runtime 动态库，缺失时会自动回退到能量 VAD）
silero-vad = ["dep:ort", "dep:libloading"]
# VRChat OSC Chatbox 输出（跨平台）
osc = ["dep:rosc"]
# SteamVR Overlay 输出（仅 Windows 有真实实现，其它平台为 stub）
steamvr = ["dep:openvr", "dep:cosmic-text"]
# Windows Full 包：一次开启 OSC + SteamVR
extras = ["osc", "steamvr"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Desktop overlay
tauri = { version = "1.6", features = ["system-tray", "global-shortcut", "macos-private-api"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "stream", "multipart"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"
# OSC（仅 extras / osc feature）
rosc = { version = "0.11", optional = true }
# SteamVR 文本渲染（仅 steamvr feature / Windows 真实实现使用）。
# 有意放在全局依赖而非 [target.'cfg(windows)']：render.rs 是纯 Rust 代码，
# 保持其在所有平台上可编译/可单测（CI 在 Linux/macOS 上也会 check --features steamvr）。
# 因此 rust-version 需跟随 cosmic-text 的 MSRV（1.89）。
cosmic-text = { version = "0.19", optional = true }

# Audio
cpal = "0.18"
hound = "3.5"

# Edge ASR (WebSocket)
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Config / CLI
directories = "5.0"
clap = { version = "4.4", features = ["derive"] }
ort = { version = "2.0.0-rc.9", features = ["load-dynamic"], optional = true }
# 用于在调用 ort 之前探测 ONNX Runtime 是否可加载（ort 在缺失时会 panic）
libloading = { version = "0.8", optional = true }

# Windows-specific
[target.'cfg(windows)'.dependencies]
openvr = { version = "0.9", optional = true }
windows = { version = "0.52", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_Media",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = { version = "1.5" }

[dev-dependencies]
# 用于校验 icons/icon.ico（Windows 构建时 Tauri 会解析该文件）
ico = "0.4"

[profile.release]
opt-level = 3
lto = true
