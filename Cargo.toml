[package]
name = "asrtranslate"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"

[[bin]]
name = "asrtranslate"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Desktop overlay
tauri = { version = "1.6", features = ["api-all"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "stream", "multipart"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Audio
cpal = "0.18"
hound = "3.5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Config / CLI
directories = "5.0"
clap = { version = "4.4", features = ["derive"] }

# Windows-specific
[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_Media",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = { version = "1.5" }

[profile.release]
opt-level = 3
lto = true
