# git-cliff 配置：根据 Conventional Commits 生成 Release 说明 / 更新日志
# 文档: https://git-cliff.org/docs/configuration
#
# 本地预览下一版的说明（尚未打 tag）:
#   git cliff --unreleased --tag v0.1.7 --strip header
# 生成完整 CHANGELOG.md:
#   git cliff -o CHANGELOG.md

[changelog]
header = """
# 更新日志

"""
body = """
{% if version %}\
## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## 未发布
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{% if commit.breaking %}[**不兼容**] {% endif %}\
{{ commit.message | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/chinuno-usami/LiveTranslate/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
{% if version and previous.version %}
**完整对比**: [{{ previous.version }}...{{ version }}](https://github.com/chinuno-usami/LiveTranslate/compare/{{ previous.version }}...{{ version }})
{% endif %}

"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# 分组名前的 HTML 注释只用于排序，渲染时会被 striptags 去掉
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->新功能" },
  { message = "^fix", group = "<!-- 1 -->问题修复" },
  { message = "^perf", group = "<!-- 2 -->性能优化" },
  { message = "^refactor", group = "<!-- 3 -->重构" },
  { message = "^docs", group = "<!-- 4 -->文档" },
  { message = "^(chore|ci|build|style|test)", skip = true },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
