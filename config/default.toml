[audio]
# 设备选择，支持以下几种写法（用 --list-devices 查看可用值）:
#   "default"      默认输入设备
#   "microphone"   第一个麦克风
#   "loopback"     Windows 系统回环（捕获扬声器输出）
#   "mic:0"        第 0 个麦克风
#   "loopback:0"   第 0 个回环设备
#   "0"            设备列表中的第 0 个
#   "扬声器"        按设备名模糊匹配
# 注意: 回环采集仅 Windows 支持
#
# 旧版本的单源字段：[[audio.sources]] 为空时使用它合成一个默认源。
# 新版本请优先使用 [[audio.sources]]（设置页的「输入源」表格）。
device_name = "default"
# 音频分片时长（秒）
chunk_seconds = 2.0
# 目标采样率（Whisper 推荐 16000，程序会自动重采样）
sample_rate = 16000
# 声道数（内部固定下混为单声道，此项目前不影响实际采集）
channels = 1
# 音量阈值（0.0 - 1.0），仅在 vad.enabled = false 时生效
silence_threshold = 0.01
# 同时采集的输入源上限（防止多路 VAD 把 CPU 打满）
max_active_sources = 4

# 多输入源：每个源一条，顺序即 UI 展示顺序
# id: 稳定标识（事件 / OSC / 日志），仅允许字母、数字、下划线、短横线
# label: 展示名，多源时作为字幕前缀
# device: 设备 spec，语法同 device_name
# enabled: 是否参与采集（改动需重启该源）
# translate: 该源是否翻译（可热切换）
# language: 覆盖全局识别语言；留空 = 跟随全局
[[audio.sources]]
id = "default"
label = "输入源"
device = "default"
enabled = true
translate = true
language = ""

[[audio.sources]]
id = "game"
label = "游戏声音"
device = "loopback:0"
enabled = false
translate = true
language = ""

[vad]
# 是否启用 VAD 分段（推荐开启）
# 开启后按“语音边界”切句，而不是固定时长硬切，能显著减少句子被截断
enabled = true
# VAD 后端:
#   "energy" - 内置能量型，自适应噪声底 + 迟滞。无额外依赖，但不能区分音乐与人声
#   "silero" - Silero VAD 神经网络（需 ONNX Runtime 动态库），能区分音乐/噪声与人声
#              缺失 ONNX Runtime 时会自动回退到 energy 并在面板上提示
backend = "energy"
# 帧长（毫秒，仅 energy 后端；silero 固定为 512 样本 @16k）
frame_ms = 20
# 判为语音所需的、高于自适应噪声底的余量（dB，仅 energy 后端）
# 环境嘈杂就调大（如 10~12），安静环境可调小（如 6）
margin_db = 8.0
# 噪声底估计所用的分位数（0.0 - 1.0，仅 energy 后端）
noise_percentile = 0.1
# --- silero 后端专用 ---
# Silero 模型路径；留空则使用内嵌模型（models/silero_vad.onnx，MIT 许可）
silero_model = ""
# 进入语音的概率阈值（0.0 - 1.0）；退出用更低的 threshold-0.15（迟滞）
silero_threshold = 0.5
# 最短语音时长；短于此的片段会被丢弃（起始不再要求连续这么多帧）
min_speech_ms = 200
# 静音需持续多久才确认说完（调大可减少句中停顿被误切）
min_silence_ms = 400
# 单个片段最长时长，超过则强制切分（控制延迟）
max_speech_ms = 12000
# 开始前 / 结束后保留的音频，避免吃掉首尾音素
pre_pad_ms = 200
post_pad_ms = 200

[asr]
# 识别后端，可选:
#   "whisper" - 自建/兼容的 Whisper HTTP 服务（默认）
#   "edge"    - 微软 Edge 内置语音识别的在线服务（无需自建服务）
backend = "whisper"

# --- 以下为 whisper 后端配置 ---
# Whisper 兼容 API 基础 URL
base_url = "http://127.0.0.1:8765"
model = "whisper-1"
# 识别语言 (auto / zh / en 等)
# 也可在面板的语言下拉框里改，改完立即生效（无需重启）
language = "auto"
timeout_secs = 20
request_path = "/v1/audio/transcriptions"
# 访问令牌（可选）。留空/删掉则不发送认证头。
# 设置后会以 Authorization: Bearer <api_key> 发送
api_key = ""
# 认证头名称（可选），默认 Authorization。
# 若服务使用其他头部（如 api-key），在这里指定
auth_header = ""
# 过滤音乐/噪声引起的无意义识别输出（默认开启）
# 能量型 VAD 分不清音乐和人声，音乐片段会被送去识别，
# 典型输出是 [Music]、♪♪♪、"感谢观看" 之类的固定幻听文本；
# 开启后会直接丢弃，既不显示也不翻译
filter_hallucination = true

# --- edge 后端配置（仅 backend = "edge" 时生效）---
[asr.edge]
# BCP-47 语言标签（不能用 "auto"）
# 常见值: en-US / zh-CN / ja-JP / ko-KR / en-GB ...
language = "en-US"
# 单次识别超时（秒）
timeout_secs = 15
# 以下三项是服务端可能轮换的客户端身份参数，一般无需修改；
# 若哪天 edge 后端开始报 401/握手失败，可在此覆盖
# trusted_client_token = ""
# chromium_full_version = ""
# origin = ""

[translate]
# 是否翻译。false 为“仅识别”模式：不调用翻译接口，只显示 ASR 原文
# 也可在面板的“翻译”开关里切换，立即生效（无需重启）
enabled = true
# OpenAI 兼容 API
base_url = "https://api.deepseek.com/v1"
api_key = "YOUR_API_KEY"
# DeepSeek 模型名，以官方文档/控制台为准（如 deepseek-flash）
model = "deepseek-flash"
target_language = "zh-CN"
system_prompt = "You are a real-time subtitle translator. Translate naturally and concisely without adding any explanation."
timeout_secs = 20
# 是否发送 temperature。部分推理模型（如 OpenAI o 系列）不接受该字段，
# 遇到 400 时可以设为 false
send_temperature = true
temperature = 0.2
# 关闭推理模型的“思考”（思考会大幅抬高首字延迟，实时字幕建议关掉）
# 各家字段名不统一，按你用的服务选一个：
#   ""                 不处理（默认）
#   "reasoning_effort" 发送 reasoning_effort = "minimal"（OpenAI o 系列 / gpt-5）
#   "enable_thinking"  发送 enable_thinking = false（Qwen3 等）
#   "chat_template"    发送 chat_template_kwargs = { enable_thinking = false }
#                      （vLLM / SGLang 部署的 Qwen3 等）
#
# DeepSeek（OpenAI 兼容格式）没有预设可选，必须用下面的 extra_body 传
# thinking.type = "disabled"。注意 reasoning_effort 关不掉思考，只控制强度。
disable_thinking = ""
# 还需其他字段时，用 extra_body 追加到请求体（优先级最高）。
# DeepSeek 关闭思考模式：
[translate.extra_body]
thinking = { type = "disabled" }

[subtitle]
# 最多显示行数
max_lines = 3
font_size = 28
text_color = "#FFFFFF"
stroke_color = "#000000"
# 面板背景（任意 CSS 颜色，均可带透明度）
#   "transparent"            完全透明，只显示文字
#   "rgba(8, 10, 14, 0.28)"  半透明黑（默认），最后一个数字是透明度
#   "#080A0E47"              同上，等价写法：#RRGGBBAA，末尾两位 AA 是透明度（00 全透明 ~ FF 不透明）
#   "rgba(8, 10, 14, 0.6)"    更不透明
background = "rgba(8, 10, 14, 0.28)"
# 顶部工具栏背景（取值格式同上，也支持 rgba 与 #RRGGBBAA）
toolbar_background = "rgba(10, 12, 18, 0.42)"
# 是否显示源文本
show_source = false
# 窗口尺寸与位置。手动拖动窗口边缘缩放后，抬手会自动把新值写回这里。
window_width = 1200
window_height = 260
position_x = 200
position_y = 760
always_on_top = true
click_through = false
# 多源来源标识策略：
#   "auto"   同时有 ≥2 个源在跑时自动加前缀（默认）
#   "always" 始终加
#   "never"  从不加
label_sources = "auto"

# ============ 额外输出通道（Full 版） ============
# 标准版会保留但忽略这两段；换用 Full 版后设置继续生效。

[output.steamvr]
# 在 SteamVR 头显中显示字幕面板（仅 Windows Full 版）
enabled = false
# 锚点：hmd = 跟随头部；world = 固定在世界坐标
anchor = "hmd"
# 面板物理宽度（米）
width_m = 1.6
# hmd 模式：正前方距离
distance_m = 1.6
# hmd 模式：相对视线的高度偏移（负数 = 偏下）
height_offset_m = -0.28
# world 模式下的坐标（OpenVR 站立坐标系，单位米）
world_position = [0.0, 1.3, -1.6]
# world 模式下的旋转（角度，目前应用绕 Y 轴的偏航）
world_rotation_deg = [0.0, 0.0, 0.0]
# 0 = 平面；0.2~0.4 = 轻微曲面
curvature = 0.0
# 整块面板不透明度（0-1）
opacity = 0.92
# 最多显示条数（与桌面浮窗独立）
max_lines = 3
show_source = true
# 字号，以 1024px 纹理宽为基准
font_size_px = 34
# 留空 = 自动使用系统中文字体；也可指定 .ttf/.ttc 路径
font_path = ""
# 颜色格式：#RGB / #RRGGBB / #RRGGBBAA
background = "#0B0F14CC"
text_color = "#FFFFFF"
source_color = "#AEB8C4"
label_color = "#7DD3FC"
# 最新一行 / 第二行 / 更早行的不透明度（做渐隐）
# 最新一行 → 更早行的淡出系数（三档，0–1）
line_alphas = [1.0, 0.72, 0.48]
# >0 时静音 N 秒后淡出（0 = 不自动隐藏）
hide_on_silence_secs = 0
# 某些运行环境下 RGBA/BGRA 反了时打开
swap_red_blue = false
# SteamVR 未启动时的重连间隔（秒）
reconnect_interval_secs = 5

[output.osc]
# 通过 OSC 把字幕发送到 VRChat Chatbox（仅 Full 版）
enabled = false
target = "127.0.0.1:9000"
# 发送内容："translated" | "source" | "both"
content = "translated"
# 组包模式：
#   "rolling" 合并最近多条字幕成一段滚动字幕，超长时丢弃最早的一条（默认）
#   "latest"  只发送最新一条字幕（旧行为）
mode = "rolling"
# rolling 模式保留的最大条数（VRChat 最多显示 9 行；建议 3~5）
max_lines = 4
# VRChat Chatbox 上限；按 Unicode 字符截断（含分隔符与来源前缀）
max_chars = 144
# 行分隔符："\n" 可读性最好；若客户端过滤换行可改成 " | "
separator = "\n"
# 客户端限流：VRChat 约 5 条 / 5 秒，超限可能触发 30s 冷却
min_interval_ms = 2000
# 5 秒滑动窗口内最多发送条数
max_per_window = 4
# 采集期间发送 /chatbox/typing true
send_typing = true
# 额外自定义地址（可选）：把 (text, source_id, label) 三个 string 发到
# /livetranslate/subtitle，这里的值是 UDP 目标 host:port（不是 OSC 路径）
custom_address = ""
# 把组包结果写日志（调试用）
debug_log = false
