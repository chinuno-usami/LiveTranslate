[audio]
# 设备选择，支持以下几种写法（用 --list-devices 查看可用值）:
#   "default"      默认输入设备
#   "microphone"   第一个麦克风
#   "loopback"     Windows 系统回环（捕获扬声器输出）
#   "mic:0"        第 0 个麦克风
#   "loopback:0"   第 0 个回环设备
#   "0"            设备列表中的第 0 个
#   "扬声器"        按设备名模糊匹配
# 注意: 回环采集仅 Windows 支持
#
# 也可以直接在浮窗顶部下拉框里切换设备。
device_name = "default"
# 音频分片时长（秒）
chunk_seconds = 2.0
# 目标采样率（Whisper 推荐 16000，程序会自动重采样）
sample_rate = 16000
# 声道数（内部固定下混为单声道，此项目前不影响实际采集）
channels = 1
# 音量阈值（0.0 - 1.0），仅在 vad.enabled = false 时生效
silence_threshold = 0.01

[vad]
# 是否启用 VAD 分段（推荐开启）
# 开启后按“语音边界”切句，而不是固定时长硬切，能显著减少句子被截断
enabled = true
# 帧长（毫秒），推荐 20
frame_ms = 20
# 判为语音所需的、高于自适应噪声底的余量（dB）
# 环境嘈杂就调大（如 10~12），安静环境可调小（如 6）
margin_db = 8.0
# 噪声底估计所用的分位数（0.0 - 1.0）
noise_percentile = 0.1
# 语音需持续多久才确认开始，同时也是最短片段长度
min_speech_ms = 200
# 静音需持续多久才确认说完（调大可减少句中停顿被误切）
min_silence_ms = 400
# 单个片段最长时长，超过则强制切分（控制延迟）
max_speech_ms = 12000
# 开始前 / 结束后保留的音频，避免吃掉首尾音素
pre_pad_ms = 200
post_pad_ms = 200

[asr]
# Whisper 兼容 API 基础 URL
base_url = "http://127.0.0.1:8765"
model = "whisper-1"
language = "auto"
timeout_secs = 20
request_path = "/v1/audio/transcriptions"
# 访问令牌（可选）。留空/删掉则不发送认证头。
# 设置后会以 Authorization: Bearer <api_key> 发送
api_key = ""
# 认证头名称（可选），默认 Authorization。
# 若服务使用其他头部（如 api-key），在这里指定
auth_header = ""

[translate]
# OpenAI 兼容 API
base_url = "https://api.openai.com/v1"
api_key = "YOUR_API_KEY"
model = "gpt-4o-mini"
target_language = "zh-CN"
system_prompt = "You are a real-time subtitle translator. Translate naturally and concisely without adding any explanation."
timeout_secs = 20

[subtitle]
# 最多显示行数
max_lines = 3
font_size = 28
text_color = "#FFFFFF"
stroke_color = "#000000"
background = "transparent"
# 是否显示源文本
show_source = false
window_width = 1200
window_height = 260
position_x = 200
position_y = 760
always_on_top = true
click_through = false
